function nodeColor(id) { return colors[id] || '#888'; }

// Force simulation
let scale = 1, offX = 0, offY = 0;

function simulate() {
  const k = 80;
  const iter = 3;
  for (let t = 0; t < iter; t++) {
    // repulsion
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const dx = nodes[j].x - nodes[i].x;
        const dy = nodes[j].y - nodes[i].y;
        const d = Math.sqrt(dx*dx+dy*dy) || 1;
        const f = k*k / d;
        nodes[i].vx -= f*dx/d; nodes[i].vy -= f*dy/d;
        nodes[j].vx += f*dx/d; nodes[j].vy += f*dy/d;
      }
    }
    // attraction along edges
    DATA.edges.forEach(([a,b]) => {
      const na = nodeMap[a], nb = nodeMap[b];
      if (!na||!nb) return;
      const dx = nb.x - na.x, dy = nb.y - na.y;
      const d = Math.sqrt(dx*dx+dy*dy) || 1;
      const f = (d - k*1.5) / 30;
      na.vx += f*dx/d; na.vy += f*dy/d;
      nb.vx -= f*dx/d; nb.vy -= f*dy/d;
    });
    // gravity toward center
    nodes.forEach(n => {
      n.vx += (W/2 - n.x) * 0.002;
      n.vy += (H/2 - n.y) * 0.002;
      n.vx *= 0.85; n.vy *= 0.85;
      n.x += n.vx; n.y += n.vy;
    });
  }
}

// Draw
function toScreen(x, y) {
  return [(x + offX) * scale + W/2 - W/2*scale + W/2*(1-scale),
          (y + offY) * scale + H/2 - H/2*scale + H/2*(1-scale)];
}

let running = true;
function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0,0,W,H);

  // edges
  DATA.edges.forEach(([a,b]) => {
    const na = nodeMap[a], nb = nodeMap[b];
    if (!na||!nb) return;
    const [ax,ay] = toScreen(na.x, na.y);
    const [bx,by] = toScreen(nb.x, nb.y);
    ctx.beginPath();
    ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
    ctx.strokeStyle = 'rgba(100,100,150,0.15)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  });

  // nodes
  nodes.forEach(n => {
    const [sx,sy] = toScreen(n.x, n.y);
    const r = Math.max(4, Math.min(14, 4 + n.deg * 1.2)) * scale;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI*2);
    ctx.fillStyle = nodeColor(n.id);
    ctx.globalAlpha = 0.85;
    ctx.fill();
    ctx.globalAlpha = 1;

    // label
    const fs = Math.max(8, 9 * scale);
    ctx.font = `${fs}px monospace`;
    ctx.fillStyle = 'rgba(200,200,210,0.7)';
    ctx.fillText(n.label, sx + r + 2, sy + 3);
  });
}

let frame = 0;
function loop() {
  if (running && frame < 300) simulate();
  frame++;
  draw();
  requestAnimationFrame(loop);
}
loop();

// Tooltip
canvas.addEventListener('mousemove', e => {
  const tip = document.getElementById('tooltip');
  let found = null;
  for (const n of nodes) {
    const [sx,sy] = toScreen(n.x, n.y);
    const r = Math.max(4, Math.min(14, 4 + n.deg * 1.2)) * scale;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (dx*dx+dy*dy < r*r*4) { found = n; break; }
  }
  if (found) {
    const incoming = DATA.edges.filter(([,b]) => b===found.id).map(([a]) => DATA.nodes[a]);
    const outgoing = DATA.edges.filter(([a]) => a===found.id).map(([,b]) => DATA.nodes[b]);
    tip.style.display = 'block';
    tip.style.left = (e.clientX+14)+'px';
    tip.style.top = (e.clientY-10)+'px';
    tip.innerHTML = `<strong style="color:#fff">${found.label}</strong><br>` +
      `<span style="color:#666">degree: ${found.deg}</span><br>` +
      (outgoing.length ? `→ ${outgoing.slice(0,4).join(', ')}${outgoing.length>4?'…':''}` : '');
  } else {
    tip.style.display = 'none';
  }
});

// Pan
let dragging = false, dragX, dragY;
canvas.addEventListener('mousedown', e => { dragging = true; dragX = e.clientX; dragY = e.clientY; });
canvas.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  offX += (e.clientX - dragX) / scale;
  offY += (e.clientY - dragY) / scale;
  dragX = e.clientX; dragY = e.clientY;
});

// Zoom
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  scale *= e.deltaY < 0 ? 1.1 : 0.9;
  scale = Math.max(0.2, Math.min(4, scale));
}, { passive: false });
</script>
